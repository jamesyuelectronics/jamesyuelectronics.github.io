<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1500px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
        }

        .item {
            display: grid;
            grid-template-columns: 2fr 1fr; /* image 2/3, text 1/3 */
            align-items: center;
            gap: 40px;

            background: white;
            padding: 25px;
            margin-bottom: 50px;
            border-radius: 10px;
        }

        .item img {
            width: 100%;
            height: 500px;
            object-fit: contain;
            border-radius: 8px;
        }

        .description {
            width: 100%;
        }

        .description h2 {
            margin-top: 0;
        }

        .description p {
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .item {
                grid-template-columns: 1fr;
            }

            .item img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Project</h1>

    <div class="item">
        <img src="images/picture1.jpg" alt="Picture 1">

        <div class="description">
            <h2>Picture 1</h2>
            <p>
                Put your explanation for the first picture here.
            </p>
        </div>
    </div>


    <div class="item">
        <img src="images/picture2.jpg" alt="Picture 2">

        <div class="description">
            <h2>Picture 2</h2>
            <p>
                Put your explanation for the second picture here.
            </p>
        </div>
    </div>


    <div class="item">
        <img src="images/picture3.jpg" alt="Picture 3">

        <div class="description">
            <h2>Picture 3</h2>
            <p>
                Put your explanation for the third picture here.
            </p>
        </div>
    </div>


    <div class="item">
        <img src="images/picture4.jpg" alt="Picture 4">

        <div class="description">
            <h2>Picture 4</h2>
            <p>
                Put your explanation for the fourth picture here.
            </p>
        </div>
    </div>

</div>

</body>
</html>
